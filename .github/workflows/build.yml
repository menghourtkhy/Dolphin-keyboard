                  public GestureKeyboardView(Context context) {
                      super(context);
                      prefs = context.getSharedPreferences("khmer_emoji_prefs", Context.MODE_PRIVATE);

                      borderPaint.setStyle(Paint.Style.STROKE);
                      borderPaint.setStrokeWidth(2f);
                      topTextPaint.setTextAlign(Paint.Align.CENTER);
                      botTextPaint.setTextAlign(Paint.Align.CENTER);
                      popupTextPaint.setColor(Color.WHITE);
                      popupTextPaint.setTextAlign(Paint.Align.CENTER);

                      reloadThemeFromPrefs();
                      initAllEmojis();
                  }

                  public void reloadThemeFromPrefs() {
                      themeIndex = prefs.getInt("theme_index", 0);
                      if (themeIndex < 0 || themeIndex >= THEMES.length) themeIndex = 0;
                      applyTheme(themeIndex);
                  }

                  private void applyTheme(int idx) {
                      themeIndex = idx;
                      prefs.edit().putInt("theme_index", themeIndex).apply();
                      String[] t = THEMES[themeIndex];
                      bgPaint.setColor(Color.parseColor(t[1]));
                      keyPaint.setColor(Color.parseColor(t[2]));
                      spKeyPaint.setColor(Color.parseColor(t[4]));
                      borderPaint.setColor(Color.parseColor(t[5]));
                      topTextPaint.setColor(Color.parseColor(t[6]));
                      botTextPaint.setColor(Color.parseColor(t[7]));
                      accentPaint.setColor(Color.parseColor(t[8]));
                      invalidate();
                  }

                  private void addRange(List<String> list, int start, int end) {
                      for (int cp = start; cp <= end; cp++) {
                          if (!Character.isDefined(cp)) continue;
                          String s = new String(Character.toChars(cp));
                          if (topTextPaint.hasGlyph(s) && !list.contains(s)) {
                              list.add(s);
                          }
                      }
                  }

                  private void addItems(List<String> list, String... items) {
                      for (String s : items) {
                          if (topTextPaint.hasGlyph(s) && !list.contains(s)) {
                              list.add(s);
                          }
                      }
                  }

