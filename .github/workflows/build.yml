                      String saved = prefs.getString("recents", "😂,❤️,🙏,😭,😍,🥰,🔥,👍,🇰🇭,🎉,😊,😁,🤣,😘,🥺,🤩,👏,💯,✨,🪷,🍜,🧋,🛵,💰");
                      for (String e : saved.split(",")) {
