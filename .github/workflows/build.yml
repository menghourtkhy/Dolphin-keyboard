                      {"Dark Mode (ងងឹត)", "#0F172A", "#1E293B", "#334155", "#334155", "#475569", "#F8FAFC", "#94A3B8", "#2563EB"},
                      {"Red (ក្រហម)", "#7F1D1D", "#B91C1C", "#991B1B", "#991B1B", "#DC2626", "#FFFFFF", "#FECACA", "#EF4444"},
                      {"Blue (ខៀវ)", "#1E3A8A", "#1D4ED8", "#1E40AF", "#1E40AF", "#3B82F6", "#FFFFFF", "#BFDBFE", "#0284C7"},
                      {"Gold (មាស)", "#78350F", "#D97706", "#B45309", "#92400E", "#F59E0B", "#FFFFFF", "#FEF08A", "#CA8A04"},
                      {"Cherry (ឆឺរី)", "#831843", "#BE185D", "#9D174D", "#9D174D", "#EC4899", "#FFFFFF", "#FBCFE8", "#E11D48"},
                      {"Orange (ទឹកក្រូច)", "#7C2D12", "#EA580C", "#C2410C", "#9A3412", "#F97316", "#FFFFFF", "#FED7AA", "#D97706"},
                      {"Green (បៃតង)", "#14532D", "#15803D", "#166534", "#166534", "#22C55E", "#FFFFFF", "#BBF7D0", "#059669"}
                  };

                  private float startX, startY, curX, curY, lastY;
                  private boolean isTouching = false;
                  private boolean twoFingerGesture = false;
                  private float twoFingerStartY = 0;
                  private int downRow = -1, downCol = -1;

                  private final Paint bgPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint keyPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint spKeyPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
