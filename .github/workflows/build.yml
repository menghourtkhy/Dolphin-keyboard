                      addRange(emojiLists[7], 0x1F9E0, 0x1F9FF);
                      addRange(emojiLists[7], 0x1FA90, 0x1FAAC);
                      addItems(emojiLists[7], "⌚","📱","📲","💻","⌨️","🖥️","🖨️","🖱️","🖲️","🕹️","🗜️","💽","💾","💿","📀","📼","📷","📸","📹","🎥","📽️","🎞️","📞","☎️","📟","📠","📺","📻","🎙️","🎚️","🎛️","🧭","⏱️","⏲️","⏰","🕰️","⌛","⏳","📡","🔋","🪫","🔌","💡","🔦","🕯️","🪔","🧯","🛢️","💸","💵","💴","💶","💷","🪙","💰","💳","💎","⚖️","🪜","🧰","🪛","🔧","🔨","⚒️","🛠️","⛏️","🪚","🔩","⚙️","🪤","🧱","⛓️","🧲","🔫","💣","🧨","🪓","🔪","🗡️","⚔️","🛡️","🚬","⚰️","🪦","⚱️");

                      addItems(emojiLists[8], "🇰🇭","❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","✅","☑️","✔️","❌","❎","➕","➖","➗","✖️","♾️","❓","❔","❕","❗","〰️","💱","💲","⚕️","♻️","⚜️","🔱","📛","🔰","⭕","🛑","⛔","🚫","💯","💢","♨️","⬆️","↗️","➡️","↘️","⬇️","↙️","⬅️","↖️","↕️","↔️","↩️","↪️","⤴️","⤵️","🔃","🔄","🔙","🔚","🔛","🔜","🔝","☸️","🕉️","☯️","✝️","☪️","☮️","🏁","🚩","🎌","🏴","🏳️");
                      String[] priorityCountries = {"KH","US","GB","FR","JP","KR","CN","TH","VN","LA","SG","MY","ID","PH","MM","BN","AU","CA","DE","IT","ES","BR","IN","RU"};
                      for (String code : priorityCountries) {
                          addItems(emojiLists[8], countryCodeToFlag(code));
                      }
                      for (char c1 = 'A'; c1 <= 'Z'; c1++) {
                          for (char c2 = 'A'; c2 <= 'Z'; c2++) {
                              addItems(emojiLists[8], countryCodeToFlag("" + c1 + c2));
                          }
                      }
                  }

                  private String countryCodeToFlag(String code) {
                      int first = Character.codePointAt(code, 0) - 'A' + 0x1F1E6;
                      int second = Character.codePointAt(code, 1) - 'A' + 0x1F1E6;
                      return new String(Character.toChars(first)) + new String(Character.toChars(second));
                  }

                  private void recordRecentEmoji(String emoji) {
                      emojiLists[0].remove(emoji);
                      emojiLists[0].add(0, emoji);
                      if (emojiLists[0].size() > 48) {
                          emojiLists[0].remove(emojiLists[0].size() - 1);
                      }
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < emojiLists[0].size(); i++) {
                          if (i > 0) sb.append(",");
                          sb.append(emojiLists[0].get(i));
                      }
                      prefs.edit().putString("recents", sb.toString()).apply();
                  }

                  private float dp(float v) {
                      return v * getResources().getDisplayMetrics().density;
                  }

                  // Smart responsive row height calculation based on screen size and user preset
                  private float getSmartRowHeight() {
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      boolean isLandscape = dm.widthPixels > dm.heightPixels;
                      float baseRowH = isLandscape ? dp(42) : Math.max(dp(50), Math.min(dp(62), dm.heightPixels * 0.068f));
                      return baseRowH * SIZE_SCALES[sizeIndex];
                  }

                  @Override
                  protected void onMeasure(int widthMeasureSpec, int heightMeasureSpec) {
                      int w = MeasureSpec.getSize(widthMeasureSpec);
                      // Lock total rows across ALL modes (including Emoji) so height NEVER jumps!
                      int rows = showNumberRow ? 5 : 4;
                      int h = Math.round(rows * getSmartRowHeight());
                      setMeasuredDimension(w, h);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      canvas.drawRect(0, 0, w, h, bgPaint);

                      int totalRows = showNumberRow ? 5 : 4;
                      float rowH = (float) h / totalRows;

                      if (currentMode == MODE_EMOJI) {
                          drawEmojiOrThemeMode(canvas, w, h, rowH);
                          return;
                      }

                      float colW = (float) w / 10f;

                      int rOffset = 0;
                      if (showNumberRow) {
                          String[][] nums = (currentMode == MODE_EN) ? EN_NUMS : KH_NUMS;
                          for (int c = 0; c < 10; c++) {
                              drawDualKey(canvas, c * colW, 0, colW, rowH, nums[c][0], nums[c][1], false);
                          }
                          rOffset = 1;
                      }

                      String[][][] activeRows = (currentMode == MODE_KH) ? KH_ROWS :
                                                 (currentMode == MODE_EN) ? EN_ROWS : SYM_ROWS;

                      for (int r = 0; r < 3; r++) {
                          float y = (r + rOffset) * rowH;
                          for (int c = 0; c < 10; c++) {
                              boolean pressed = isTouching && (downRow == r + rOffset) && (downCol == c);
                              drawDualKey(canvas, c * colW, y, colW, rowH, activeRows[r][c][0], activeRows[r][c][1], pressed);
                          }
                      }

                      drawBottomBar(canvas, w, (totalRows - 1) * rowH, rowH);

                      if (isTouching && !twoFingerGesture && downRow >= 0 && downRow < totalRows - 1 && downCol >= 0) {
                          boolean swipingDown = (curY - startY) > rowH * 0.38f;
                          String preview = getKeyChar(downRow, downCol, swipingDown);
                          if (!preview.isEmpty()) {
                              float px = (downCol + 0.5f) * colW;
                              float py = downRow * rowH;
                              RectF popRect = new RectF(px - dp(28), Math.max(dp(4), py - rowH * 0.95f), px + dp(28), py + dp(6));
                              popupPaint.setColor(swipingDown ? Color.parseColor(THEMES[themeIndex][8]) : Color.parseColor("#475569"));
                              canvas.drawRoundRect(popRect, dp(8), dp(8), popupPaint);
                              popupTextPaint.setTextSize(rowH * 0.42f);
                              canvas.drawText(preview, popRect.centerX(), popRect.centerY() + rowH * 0.14f, popupTextPaint);
                          }
                      }
                  }

                  private void drawDualKey(Canvas canvas, float x, float y, float w, float h, String top, String bot, boolean pressed) {
                      RectF rect = new RectF(x + 1.5f, y + 1.5f, x + w - 1.5f, y + h - 1.5f);
                      keyPaint.setColor(Color.parseColor(pressed ? THEMES[themeIndex][3] : THEMES[themeIndex][2]));
                      canvas.drawRoundRect(rect, dp(5), dp(5), keyPaint);
                      canvas.drawRoundRect(rect, dp(5), dp(5), borderPaint);

                      topTextPaint.setTextSize(Math.min(dp(22), h * 0.35f));
                      botTextPaint.setTextSize(Math.min(dp(14), h * 0.22f));

                      canvas.drawText(top, x + w / 2f, y + h * 0.45f, topTextPaint);
                      canvas.drawText(bot, x + w / 2f, y + h * 0.82f, botTextPaint);
                  }

                  private void drawBottomBar(Canvas canvas, int w, float y, float rowH) {
                      float unit = w / 10f;
                      float labelSize = Math.min(dp(18), rowH * 0.31f);

                      drawSpecialKey(canvas, 0, y, unit, rowH, currentMode == MODE_EMOJI ? "ក/A" : "😊", false);
                      String globeLabel = (currentMode == MODE_EN) ? "🌐 EN" : "🌐 ខ្មែរ";
                      drawSpecialKey(canvas, unit, y, unit * 1.3f, rowH, globeLabel, false);

                      float spX = unit * 2.3f;
                      float spW = unit * 5.1f;
                      RectF spRect = new RectF(spX + 1.5f, y + 1.5f, spX + spW - 1.5f, y + rowH - 1.5f);
                      keyPaint.setColor(Color.parseColor(THEMES[themeIndex][2]));
                      canvas.drawRoundRect(spRect, dp(5), dp(5), keyPaint);
                      canvas.drawRoundRect(spRect, dp(5), dp(5), borderPaint);
                      topTextPaint.setTextSize(labelSize);
                      canvas.drawText("?", spX + dp(18), y + rowH * 0.62f, topTextPaint);
                      canvas.drawText("។", spX + spW - dp(18), y + rowH * 0.62f, topTextPaint);

                      float delX = unit * 7.4f;
                      drawSpecialKey(canvas, delX, y, unit * 1.3f, rowH, "⌫", false);

                      float entX = unit * 8.7f;
                      drawSpecialKey(canvas, entX, y, unit * 1.3f, rowH, "⏎", false);
                  }

                  private void drawSpecialKey(Canvas canvas, float x, float y, float w, float h, String label, boolean highlight) {
                      RectF rect = new RectF(x + 1.5f, y + 1.5f, x + w - 1.5f, y + h - 1.5f);
                      spKeyPaint.setColor(Color.parseColor(highlight ? THEMES[themeIndex][8] : THEMES[themeIndex][4]));
                      canvas.drawRoundRect(rect, dp(5), dp(5), spKeyPaint);
                      canvas.drawRoundRect(rect, dp(5), dp(5), borderPaint);
                      topTextPaint.setTextSize(Math.min(dp(16), h * 0.28f));
                      canvas.drawText(label, x + w / 2f, y + h * 0.62f, topTextPaint);
                  }

                  private void drawEmojiOrThemeMode(Canvas canvas, int w, int h, float rowH) {
                      float tabH = rowH * 0.68f;
                      // Lock bottom bar to the exact same rowH as the main keyboard!
                      float bottomH = rowH;
                      float gridTop = tabH;
                      float gridBottom = h - bottomH;
                      float gridH = gridBottom - gridTop;

                      float tabW = w / 10f;
                      spKeyPaint.setColor(Color.parseColor(THEMES[themeIndex][4]));
                      canvas.drawRect(0, 0, w, tabH, spKeyPaint);
                      topTextPaint.setTextSize(Math.min(dp(18), tabH * 0.48f));
                      for (int i = 0; i < 10; i++) {
                          float tx = i * tabW;
                          if (i == emojiCat) {
                              canvas.drawRect(tx + dp(4), tabH - dp(3), tx + tabW - dp(4), tabH, accentPaint);
                          }
                          canvas.drawText(CAT_ICONS[i], tx + tabW / 2f, tabH * 0.68f, topTextPaint);
                      }

                      // Tab 9 (🎨): 4 Size Buttons at Top + 8 Color Theme Cards Below
                      if (emojiCat == 9) {
                          float sizeBarH = gridH * 0.28f;
                          float sizeBtnW = w / 4f;
                          for (int s = 0; s < 4; s++) {
                              float sx = s * sizeBtnW;
                              RectF sRect = new RectF(sx + dp(4), gridTop + dp(4), sx + sizeBtnW - dp(4), gridTop + sizeBarH - dp(4));
                              spKeyPaint.setColor(Color.parseColor(s == sizeIndex ? THEMES[themeIndex][8] : THEMES[themeIndex][4]));
                              canvas.drawRoundRect(sRect, dp(6), dp(6), spKeyPaint);
                              popupTextPaint.setColor(s == sizeIndex ? Color.WHITE : Color.parseColor(THEMES[themeIndex][6]));
                              popupTextPaint.setTextSize(Math.min(dp(13), sizeBarH * 0.34f));
                              canvas.drawText(SIZE_LABELS[s], sRect.centerX(), sRect.centerY() + dp(4), popupTextPaint);
                          }

                          float colorAreaTop = gridTop + sizeBarH;
                          float colorAreaH = gridH - sizeBarH;
                          float cardW = w / 4f;
                          float cardH = colorAreaH / 2f;
                          for (int i = 0; i < 8; i++) {
                              int r = i / 4;
                              int c = i % 4;
                              float cx = c * cardW;
                              float cy = colorAreaTop + r * cardH;
                              RectF card = new RectF(cx + dp(4), cy + dp(4), cx + cardW - dp(4), cy + cardH - dp(4));
                              keyPaint.setColor(Color.parseColor(THEMES[i][2]));
                              canvas.drawRoundRect(card, dp(7), dp(7), keyPaint);

                              borderPaint.setColor(i == themeIndex ? Color.WHITE : Color.parseColor(THEMES[i][5]));
                              borderPaint.setStrokeWidth(i == themeIndex ? 5f : 2f);
                              canvas.drawRoundRect(card, dp(7), dp(7), borderPaint);
                              borderPaint.setStrokeWidth(2f);

                              popupTextPaint.setColor(Color.parseColor(THEMES[i][6]));
                              popupTextPaint.setTextSize(Math.min(dp(12), cardH * 0.26f));
                              canvas.drawText(THEMES[i][0], card.centerX(), card.centerY() + dp(4), popupTextPaint);
                          }
                          popupTextPaint.setColor(Color.WHITE);
                          borderPaint.setColor(Color.parseColor(THEMES[themeIndex][5]));
                          drawBottomBar(canvas, w, gridBottom, bottomH);
                          return;
                      }

                      // Smart Auto-Fitting Emoji Grid: Divide gridH into exact whole rows so emojis never get cut in half!
                      List<String> list = emojiLists[emojiCat];
                      int cols = 8;
                      int visibleRows = showNumberRow ? 4 : 3;
                      float cellW = (w - dp(8)) / cols;
                      float cellH = gridH / visibleRows;
                      int totalEmojiRows = (int) Math.ceil(list.size() / (float) cols);

                      maxEmojiScrollY = Math.max(0f, totalEmojiRows * cellH - gridH);
                      if (emojiScrollY > maxEmojiScrollY) emojiScrollY = maxEmojiScrollY;
                      if (emojiScrollY < 0f) emojiScrollY = 0f;

                      canvas.save();
                      canvas.clipRect(0, gridTop, w, gridBottom);
                      canvas.drawColor(Color.parseColor(THEMES[themeIndex][1]));

                      topTextPaint.setTextSize(Math.min(dp(25), cellH * 0.54f));
                      int firstRow = Math.max(0, (int) (emojiScrollY / cellH));
                      int lastRow = Math.min(totalEmojiRows - 1, (int) ((emojiScrollY + gridH) / cellH) + 1);

                      for (int r = firstRow; r <= lastRow; r++) {
                          float cy = gridTop + r * cellH - emojiScrollY;
                          for (int c = 0; c < cols; c++) {
                              int idx = r * cols + c;
                              if (idx >= list.size()) break;
                              float cx = c * cellW;
                              canvas.drawText(list.get(idx), cx + cellW / 2f, cy + cellH * 0.68f, topTextPaint);
                          }
                      }

                      if (maxEmojiScrollY > 0) {
                          float thumbH = Math.max(dp(24), gridH * (gridH / (totalEmojiRows * cellH)));
                          float thumbY = gridTop + (emojiScrollY / maxEmojiScrollY) * (gridH - thumbH);
                          RectF bar = new RectF(w - dp(5), thumbY, w - dp(2), thumbY + thumbH);
                          canvas.drawRoundRect(bar, dp(2), dp(2), accentPaint);
                      }
                      canvas.restore();

                      drawBottomBar(canvas, w, gridBottom, bottomH);
                  }

                  private String getKeyChar(int row, int col, boolean bottom) {
                      int idx = bottom ? 1 : 0;
                      int rOffset = showNumberRow ? 1 : 0;
                      if (showNumberRow && row == 0) {
                          return (currentMode == MODE_EN) ? EN_NUMS[col][idx] : KH_NUMS[col][idx];
                      }
                      int r = row - rOffset
