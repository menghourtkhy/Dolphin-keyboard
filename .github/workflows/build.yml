                  private String countryCodeToFlag(String code) {
                      int first = Character.codePointAt(code, 0) - 'A' + 0x1F1E6;
                      int second = Character.codePointAt(code, 1) - 'A' + 0x1F1E6;
                      return new String(Character.toChars(first)) + new String(Character.toChars(second));
                  }

                  private void recordRecentEmoji(String emoji) {
                      emojiLists[0].remove(emoji);
                      emojiLists[0].add(0, emoji);
                      if (emojiLists[0].size() > 48) {
                          emojiLists[0].remove(emojiLists[0].size() - 1);
                      }
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < emojiLists[0].size(); i++) {
                          if (i > 0) sb.append(",");
                          sb.append(emojiLists[0].get(i));
                      }
                      prefs.edit().putString("recents", sb.toString()).apply();
                  }

                  private float dp(float v) {
                      return v * getResources().getDisplayMetrics().density;
                  }

                  private float getSmartRowHeight() {
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      boolean isLandscape = dm.widthPixels > dm.heightPixels;
                      float baseRowH = isLandscape ? dp(42) : Math.max(dp(52), Math.min(dp(62), dm.heightPixels * 0.068f));
                      return baseRowH * SIZE_SCALES[sizeIndex];
                  }

                  @Override
                  protected void onMeasure(int widthMeasureSpec, int heightMeasureSpec) {
                      int w = MeasureSpec.getSize(widthMeasureSpec);
                      int rows = showNumberRow ? 5 : 4;
                      int h = Math.round(rows * getSmartRowHeight());
                      setMeasuredDimension(w, h);
                  }

                  private int blendColors(int c1, int c2, float ratio) {
                      float ir = 1f - ratio;
                      int r = (int) (Color.red(c1) * ir + Color.red(c2) * ratio);
                      int g = (int) (Color.green(c1) * ir + Color.green(c2) * ratio);
                      int b = (int) (Color.blue(c1) * ir + Color.blue(c2) * ratio);
                      return Color.rgb(r, g, b);
                  }

                  // Format Khmer combining marks with a clean dotted circle for keycap & popup display
                  private String formatDisplayLabel(String raw) {
                      if (raw == null || raw.isEmpty()) return "";
                      if (raw.length() == 1) {
                          char ch = raw.charAt(0);
                          if ((ch >= '\u17B6' && ch <= '\u17D3') || ch == '\u17DD') {
                              return "\u25CC" + raw;
                          }
                      } else if (raw.equals("\u17B6\u17C6") || raw.equals("\u17BB\u17C7") ||
                                 raw.equals("\u17C1\u17C7") || raw.equals("\u17C4\u17C7")) {
                          return "\u25CC" + raw;
                      }
                      return raw;
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      canvas.drawRect(0, 0, w, h, bgPaint);

                      int totalRows = showNumberRow ? 5 : 4;
                      float rowH = (float) h / totalRows;

                      boolean animatingMode = modeTransitionProgress < 0.99f;
                      if (animatingMode) {
                          int alpha = (int) (80 + 175 * modeTransitionProgress);
                          float offsetX = (1f - modeTransitionProgress) * dp(18) * modeSlideDirection;
                          canvas.saveLayerAlpha(0, 0, w, h - rowH, alpha);
                          canvas.translate(offsetX, 0);
                      }

                      if (currentMode == MODE_EMOJI) {
                          drawEmojiOrThemeMode(canvas, w, h, rowH);
                          if (animatingMode) canvas.restore();
                          drawBottomBar(canvas, w, (totalRows - 1) * rowH, rowH);
                          return;
                      }

                      float colW = (float) w / 10f;

                      int rOffset = 0;
                      if (showNumberRow) {
                          String[][] nums = (currentMode == MODE_EN) ? EN_NUMS : KH_NUMS;
                          for (int c = 0; c < 10; c++) {
                              String top = isShifted ? nums[c][1] : nums[c][0];
                              String bot = isShifted ? nums[c][0] : nums[c][1];
                              float pressRatio = getKeyPressRatio(0, c);
                              drawFlatNiDAKey(canvas, c * colW, 0, colW, rowH, top, bot, pressRatio, false);
                          }
                          rOffset = 1;
                      }

                      String[][][] activeRows = (currentMode == MODE_KH) ? KH_ROWS :
                                                 (currentMode == MODE_EN) ? EN_ROWS : SYM_ROWS;

                      for (int r = 0; r < 3; r++) {
                          float y = (r + rOffset) * rowH;
                          for (int c = 0; c < 10; c++) {
                              float pressRatio = getKeyPressRatio(r + rOffset, c);
                              String top = isShifted ? activeRows[r][c][1] : activeRows[r][c][0];
                              String bot = isShifted ? activeRows[r][c][0] : activeRows[r][c][1];
                              boolean hasCommaHint = (currentMode == MODE_KH && r == 2 && c == 7);
                              drawFlatNiDAKey(canvas, c * colW, y, colW, rowH, top, bot, pressRatio, hasCommaHint);
                          }
                      }

                      if (animatingMode) {
                          canvas.restore();
                      }

                      drawBottomBar(canvas, w, (totalRows - 1) * rowH, rowH);

                      if (isTouching && !twoFingerGesture && downRow >= 0 && downRow < totalRows - 1 && downCol >= 0) {
                          float targetMorph = (curY - startY) > rowH * 0.35f ? 1f : 0f;
                          swipeMorphProgress += (targetMorph - swipeMorphProgress) * 0.45f;
                          if (Math.abs(targetMorph - swipeMorphProgress) > 0.02f) {
                              postInvalidateOnAnimation();
                          } else {
                              swipeMorphProgress = targetMorph;
                          }

                          String topChar = formatDisplayLabel(getKeyChar(downRow, downCol, false));
                          String botChar = formatDisplayLabel(getKeyChar(downRow, downCol, true));
                          float cx = (downCol + 0.5f) * colW;
                          float keyTopY = downRow * rowH;

                          canvas.save();
                          canvas.scale(popupScaleProgress, popupScaleProgress, cx, keyTopY + rowH * 0.5f);

                          if (swipeMorphProgress > 0.3f) {
                              float pw = Math.max(colW * 1.35f, dp(48));
                              float ph = rowH * (1.15f + 0.12f * swipeMorphProgress);
                              float left = Math.max(dp(4), Math.min(w - pw - dp(4), cx - pw / 2f));
                              float right = left + pw;
                              float top = Math.max(dp(4), keyTopY - ph * 0.45f);
                              float roofY = top + ph * (0.32f * swipeMorphProgress);
                              float bottom = top + ph;

                              popupPath.reset();
                              popupPath.moveTo(left + pw / 2f, top);
                              popupPath.lineTo(right, roofY);
                              popupPath.lineTo(right, bottom - dp(6));
                              popupPath.quadTo(right, bottom, right - dp(6), bottom);
                              popupPath.lineTo(left + dp(6), bottom);
                              popupPath.quadTo(left, bottom, left, bottom - dp(6));
                              popupPath.lineTo(left, roofY);
                              popupPath.close();

                              int cNormal = Color.parseColor(THEMES[themeIndex][3]);
                              int cAccent = Color.parseColor(THEMES[themeIndex][8]);
                              popupPaint.setColor(blendColors(cNormal, cAccent, swipeMorphProgress));
                              canvas.drawPath(popupPath, popupPaint);

                              popupTextPaint.setColor(Color.WHITE);
                              popupTextPaint.setTextSize(rowH * 0.40f);
                              canvas.drawText(botChar, left + pw / 2f, bottom - ph * 0.25f, popupTextPaint);
                          } else {
                              float pw = colW * 1.16f;
                              float left = Math.max(dp(2), Math.min(w - pw - dp(2), cx - pw / 2f));
                              float top = Math.max(dp(2), keyTopY - rowH * 0.35f);
                              float bottom = keyTopY + rowH;
                              RectF rect = new RectF(left, top, left + pw, bottom);

                              popupPaint.setColor(Color.parseColor(THEMES[themeIndex][3]));
                              canvas.drawRoundRect(rect, dp(4), dp(4), popupPaint);
                              canvas.drawRoundRect(rect, dp(4), dp(4), borderPaint);

                              popupTextPaint.setColor(Color.parseColor(THEMES[themeIndex][6]));
                              popupTextPaint.setTextSize(rowH * 0.40f);
                              canvas.drawText(topChar, rect.centerX(), top + (bottom - top) * 0.48f, popupTextPaint);

                              botTextPaint.setTextSize(rowH * 0.22f);
                              canvas.drawText(botChar, rect.centerX(), top + (bottom - top) * 0.82f, botTextPaint);
                          }
                          canvas.restore();
                      }
                  }

                  private float getKeyPressRatio(int r, int c) {
                      if (isTouching && downRow == r && downCol == c) return 1f;
                      if (lastReleasedRow == r && lastReleasedCol == c && keyReleaseFade > 0f) return keyReleaseFade;
                      return 0f;
                  }

                  private void drawFlatNiDAKey(Canvas canvas, float x, float y, float w, float h, String top, String bot, float pressRatio, boolean commaHint) {
                      RectF rect = new RectF(x, y, x + w, y + h);
                      int normalColor = Color.parseColor(THEMES[themeIndex][2]);
                      int pressedColor = Color.parseColor(THEMES[themeIndex][3]);
                      keyPaint.setColor(pressRatio > 0f ? blendColors(normalColor, pressedColor, pressRatio) : normalColor);
                      canvas.drawRect(rect, keyPaint);
                      canvas.drawRect(rect, borderPaint);

                      topTextPaint.setTextSize(Math.min(dp(20), h * 0.35f));
                      botTextPaint.setTextSize(Math.min(dp(12), h * 0.20f));

                      canvas.drawText(formatDisplayLabel(top), x + w / 2f, y + h * 0.45f, topTextPaint);
                      canvas.drawText(formatDisplayLabel(bot), x + w / 2f, y + h * 0.83f, botTextPaint);

                      if (commaHint) {
                          botTextPaint.setTextSize(Math.min(dp(11), h * 0.18f));
                          canvas.drawText(",", x + w * 0.24f, y + h * 0.62f, botTextPaint);
                      }
                  }

                  private void drawBottomBar(Canvas canvas, int w, float y, float rowH) {
                      float unit = w / 10f;
                      float labelSize = Math.min(dp(18), rowH * 0.32f);

                      String leftLabel = (currentMode == MODE_EMOJI) ? "ក/A" : (useShiftKeyMode ? (isShifted ? "⬆️" : "⇧") : "😊");
                      drawFlatSpecialKey(canvas, 0, y, unit * 1.15f, rowH, leftLabel, useShiftKeyMode && isShifted);

                      String secLabel = useShiftKeyMode ? (currentMode == MODE_EMOJI ? "🌐" : "😊") : "🌐";
                      drawFlatSpecialKey(canvas, unit * 1.15f, y, unit * 1.15f, rowH, secLabel, false);

                      float spX = unit * 2.3f;
                      float spW = unit * 5.1f;
                      RectF spRect = new RectF(spX, y, spX + spW, y + rowH);
                      keyPaint.setColor(Color.parseColor(THEMES[themeIndex][2]));
                      canvas.drawRect(spRect, keyPaint);
                      canvas.drawRect(spRect, borderPaint);

                      topTextPaint.setTextSize(labelSize);
                      canvas.drawText("?", spX + dp(16), y + rowH * 0.62f, topTextPaint);
                      if (useShiftKeyMode) {
                          botTextPaint.setTextSize(dp(11));
                          canvas.drawText(currentMode == MODE_EN ? "EN (🌐)" : "ខ្មែរ (🌐)", spX + spW / 2f, y + rowH * 0.60f, botTextPaint);
                      }
                      canvas.drawText("\u17D4", spX + spW - dp(16), y + rowH * 0.62f, topTextPaint);

                      float delX = unit * 7.4f;
                      drawFlatSpecialKey(canvas, delX, y, unit * 1.3f, rowH, "⌫", isHoldingBackspace);

                      float entX = unit * 8.7f;
                      drawFlatSpecialKey(canvas, entX, y, unit * 1.3f, rowH, "↵", false);
                  }

                  private void drawFlatSpecialKey(Canvas canvas, float x, float y, float w, float h, String label, boolean highlight) {
                      RectF rect = new RectF(x, y, x + w, y + h);
                      spKeyPaint.setColor(Color.parseColor(highlight ? THEMES[themeIndex][8] : THEMES[themeIndex][4]));
                      canvas.drawRect(rect, spKeyPaint);
                      canvas.drawRect(rect, borderPaint);
                      topTextPaint.setTextSize(Math.min(dp(17), h * 0.30f));
                      canvas.drawText(label, x + w / 2f, y + h * 0.62f, topTextPaint);
                  }

                  private void drawEmojiOrThemeMode(Canvas canvas, int w, int h, float rowH) {
                      float tabH = rowH * 0.68f;
                      float bottomH = rowH;
                      float gridTop = tabH;
                      float gridBottom = h - bottomH;
                      float gridH = gridBottom - gridTop;

                      float tabW = w / 10f;
                      spKeyPaint.setColor(Color.parseColor(THEMES[themeIndex][4]));
                      canvas.drawRect(0, 0, w, tabH, spKeyPaint);
                      topTextPaint.setTextSize(Math.min(dp(18), tabH * 0.48f));
                      for (int i = 0; i < 10; i++) {
                          float tx = i * tabW;
                          canvas.drawText(CAT_ICONS[i], tx + tabW / 2f, tabH * 0.68f, topTextPaint);
                      }
                      float indLeft = animTabPos * tabW + dp(4);
                      RectF indRect = new RectF(indLeft, tabH - dp(3.5f), indLeft + tabW - dp(8), tabH);
                      canvas.drawRoundRect(indRect, dp(2), dp(2), accentPaint);

                      if (emojiCat == 9) {
                          float topControlsH = gridH * 0.30f;
                          float sizeBtnW = w / 5f;
                          for (int s = 0; s < 4; s++) {
                              float sx = s * sizeBtnW;
                              RectF sRect = new RectF(sx + dp(3), gridTop + dp(3), sx + sizeBtnW - dp(3), gridTop + topControlsH - dp(3));
                              spKeyPaint.setColor(Color.parseColor(s == sizeIndex ? THEMES[themeIndex][8] : THEMES[themeIndex][4]));
                              canvas.drawRoundRect(sRect, dp(5), dp(5), spKeyPaint);
                              popupTextPaint.setColor(s == sizeIndex ? Color.WHITE : Color.parseColor(THEMES[themeIndex][6]));
                              popupTextPaint.setTextSize(Math.min(dp(11), topControlsH * 0.32f));
                              canvas.drawText(SIZE_LABELS[s], sRect.centerX(), sRect.centerY() + dp(4), popupTextPaint);
                          }
                          RectF mRect = new RectF(4 * sizeBtnW + dp(3), gridTop + dp(3), w - dp(3), gridTop + topControlsH - dp(3));
                          spKeyPaint.setColor(Color.parseColor(useShiftKeyMode ? THEMES[themeIndex][8] : THEMES[themeIndex][4]));
                          canvas.drawRoundRect(mRect, dp(5), dp(5), spKeyPaint);
                          popupTextPaint.setColor(Color.WHITE);
                          popupTextPaint.setTextSize(Math.min(dp(11), topControlsH * 0.32f));
                          canvas.drawText(useShiftKeyMode ? "Mode: ⇧" : "Mode: អូស", mRect.centerX(), mRect.centerY() + dp(4), popupTextPaint);

                          float colorAreaTop = gridTop + topControlsH;
                          float colorAreaH = gridH - topControlsH;
                          float cardW = w / 4f;
                          float cardH = colorAreaH / 2f;
                          for (int i = 0; i < 8; i++) {
                              int r = i / 4;
                              int c = i % 4;
                              float cx = c * cardW;
                              float cy = colorAreaTop + r * cardH;
                              RectF card = new RectF(cx + dp(4), cy + dp(4), cx + cardW - dp(4), cy + cardH - dp(4));
                              keyPaint.setColor(Color.parseColor(THEMES[i][2]));
                              canvas.drawRoundRect(card, dp(6), dp(6), keyPaint);

                              borderPaint.setColor(i == themeIndex ? Color.WHITE : Color.parseColor(THEMES[i][5]));
                              borderPaint.setStrokeWidth(i == themeIndex ? 4f : 1.5f);
                              canvas.drawRoundRect(card, dp(6), dp(6), borderPaint);
                              borderPaint.setStrokeWidth(1.5f);

                              popupTextPaint.setColor(Color.parseColor(THEMES[i][6]));
                              popupTextPaint.setTextSize(Math.min(dp(12), cardH * 0.26f));
                              canvas.drawText(THEMES[i][0], card.centerX(), card.centerY() + dp(4), popupTextPaint);
                          }
                          popupTextPaint.setColor(Color.WHITE);
                          borderPaint.setColor(Color.parseColor(THEMES[themeIndex][5]));
                          return;
                      }

                      List<String> list = emojiLists[emojiCat];
                      int cols = 8;
                      int visibleRows = showNumberRow ? 4 : 3;
                      float cellW = (w - dp(8)) / cols;
                      float cellH = gridH / visibleRows;
                      int totalEmojiRows = (int) Math.ceil(list.size() / (float) cols);

                      maxEmojiScrollY = Math.max(0f, totalEmojiRows * cellH - gridH);
                      if (emojiScrollY > maxEmojiScrollY) emojiScrollY = maxEmojiScrollY;
                      if (emojiScrollY < 0f) emojiScrollY = 0f;

                      canvas.save();
                      canvas.clipRect(0, gridTop, w, gridBottom);
                      canvas.drawColor(Color.parseColor(THEMES[themeIndex][2]));

                      topTextPaint.setTextSize(Math.min(dp(25), cellH * 0.54f));
                      int firstRow = Math.max(0, (int) (emojiScrollY / cellH));
                      int lastRow = Math.min(totalEmojiRows - 1, (int) ((emojiScrollY + gridH) / cellH) + 1);

                      for (int r = firstRow; r <= lastRow; r++) {
                          float cy = gridTop + r * cellH - emojiScrollY;
                          for (int c = 0; c < cols; c++) {
                              int idx = r * cols + c;
                              if (idx >= list.size()) break;
                              float cx = c * cellW;
                              canvas.drawText(list.get(idx), cx + cellW / 2f, cy + cellH * 0.68f, topTextPaint);
                          }
                      }

                      if (maxEmojiScrollY > 0) {
                          float thumbH = Math.max(dp(24), gridH * (gridH / (totalEmojiRows * cellH)));
                          float thumbY = gridTop + (emojiScrollY / maxEmojiScrollY) * (gridH - thumbH);
                          RectF bar = new RectF(w - dp(5), thumbY, w - dp(2), thumbY + thumbH);
                          canvas.drawRoundRect(bar, dp(2), dp(2), accentPaint);
                      }
                      canvas.restore();
                  }

                  private String getKeyChar(int row, int col, boolean swipeSecondary) {
                      boolean selectBottom = isShifted ? !swipeSecondary : swipeSecondary;
                      int idx = selectBottom ? 1 : 0;
                      int rOffset = showNumberRow ? 1 : 0;
                      if (showNumberRow && row == 0) {
                          return (currentMode == MODE_EN) ? EN_NUMS[col][idx] : KH_NUMS[col][idx];
                      }
                      int r = row - rOffset;
                      if (r < 0 || r >= 3 || col < 0 || col >= 10) return "";
                      String[][][] active = (currentMode == MODE_KH) ? KH_ROWS :
                                            (currentMode == MODE_EN) ? EN_ROWS : SYM_ROWS;
                      return active[r][col][idx];
                  }

                  private void stopBackspaceRepeat() {
                      isHoldingBackspace = false;
                      handler.removeCallbacks(backspaceRepeater);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      int action = event.getActionMasked();
                      int w = getWidth();
                      int h = getHeight();
                      int totalRows = showNumberRow ? 5 : 4;
                      float rowH = (float) h / totalRows;

                      if (currentMode == MODE_EMOJI) {
                          if (velocityTracker == null) velocityTracker = VelocityTracker.obtain();
                          velocityTracker.addMovement(event);
                      }

                      if (event.getPointerCount() >= 2 && currentMode != MODE_EMOJI) {
                          stopBackspaceRepeat();
                          float dy0 = event.getY(0) - startY;
                          float avgY = (event.getY(0) + event.getY(1)) / 2f;
                          if (!twoFingerGesture) {
                              if (action == MotionEvent.ACTION_POINTER_DOWN && Math.abs(dy0) < dp(15) && downRow >= 0 && downRow < totalRows - 1) {
                                  InputConnection ic = getCurrentInputConnection();
                                  if (ic != null) {
                                      String text = getKeyChar(downRow, downCol, false);
                                      if (!text.isEmpty()) ic.commitText(text, 1);
                                      if (isShifted) isShifted = false;
                                  }
                                  triggerKeyReleaseFade(downRow, downCol);
                                  int pIdx = event.getActionIndex();
                                  startX = curX = event.getX(pIdx);
                                  startY = curY = event.getY(pIdx);
                                  downRow = (int) (startY / rowH);
                                  downCol = (int) (startX / (w / 10f));
                                  swipeMorphProgress = 0f;
                                  triggerPopupAppear();
                                  invalidate();
                                  return true;
                              }
                              twoFingerGesture = true;
                              twoFingerStartY = avgY;
                          } else {
                              float dy = avgY - twoFingerStartY;
                              if (dy < -dp(25) && !showNumberRow) {
                                  showNumberRow = true;
                                  prefs.edit().putBoolean("show_num_row", true).apply();
                                  requestLayout();
                                  invalidate();
                              } else if (dy > dp(25) && showNumberRow) {
                                  showNumberRow = false;
                                  prefs.edit().putBoolean("show_num_row", false).apply();
                                  requestLayout();
                                  invalidate();
                              }
                          }
                          return true;
                      }

                      switch (action) {
                          case MotionEvent.ACTION_DOWN:
                              if (!emojiScroller.isFinished()) emojiScroller.abortAnimation();
                              twoFingerGesture = false;
                              isEmojiScrolling = false;
                              isTouching = true;
                              swipeMorphProgress = 0f;
                              startX = curX = event.getX();
                              startY = curY = lastY = event.getY();
                              downRow = (int) (startY / rowH);
                              downCol = (int) (startX / (w / 10f));
                              performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP);

                              if (currentMode != MODE_EMOJI && downRow >= 0 && downRow < totalRows - 1) {
                                  triggerPopupAppear();
                              }

                              float unit = w / 10f;
                              if (downRow == totalRows - 1 && startX >= unit * 7.4f && startX < unit * 8.7f) {
                                  isHoldingBackspace = true;
                                  handler.postDelayed(backspaceRepeater, 400);
                              }
                              invalidate();
                              break;

                          case MotionEvent.ACTION_MOVE:
                              curX = event.getX();
                              curY = event.getY();
                              if (isHoldingBackspace && (Math.abs(curX - startX) > dp(25) || Math.abs(curY - startY) > dp(25))) {
                                  stopBackspaceRepeat();
                              }
                              float tabH = rowH * 0.68f;
                              if (currentMode == MODE_EMOJI && emojiCat < 9 && startY >= tabH && startY <= h - rowH) {
                                  if (!isEmojiScrolling && Math.abs(curY - startY) > dp(10) && Math.abs(curY - startY) > Math.abs(curX - startX)) {
                                      isEmojiScrolling = true;
                                  }
                                  if (isEmojiScrolling) {
                                      emojiScrollY -= (curY - lastY);
                                      if (emojiScrollY < 0f) emojiScrollY = 0f;
                                      if (emojiScrollY > maxEmojiScrollY) emojiScrollY = maxEmojiScrollY;
                                  }
                              }
                              lastY = curY;
                              invalidate();
                              break;

                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              boolean wasHoldingBksp = isHoldingBackspace;
                              stopBackspaceRepeat();
                              isTouching = false;
                              if (currentMode != MODE_EMOJI && downRow >= 0 && downRow < totalRows - 1) {
                                  triggerKeyReleaseFade(downRow, downCol);
                              }
                              if (currentMode == MODE_EMOJI && isEmojiScrolling && velocityTracker != null) {
                                  velocityTracker.computeCurrentVelocity(1000);
                                  int vy = (int) velocityTracker.getYVelocity();
                                  if (Math.abs(vy) > dp(150)) {
                                      emojiScroller.fling(0, (int) emojiScrollY, 0, -vy, 0, 0, 0, (int) maxEmojiScrollY);
                                      postInvalidateOnAnimation();
                                  }
                                  velocityTracker.recycle();
                                  velocityTracker = null;
                              }
                              if (twoFingerGesture) {
                                  twoFingerGesture = false;
                                  invalidate();
                                  return true;
                              }
                              handleRelease(event.getX(), event.getY(), w, h, totalRows, rowH, wasHoldingBksp);
                              isEmojiScrolling = false;
                              downRow = -1;
                              downCol = -1;
                              invalidate();
                              break;
                      }
                      return true;
                  }

                  private void handleRelease(float endX, float endY, int w, int h, int totalRows, float rowH, boolean wasHoldingBksp) {
                      InputConnection ic = getCurrentInputConnection();
                      if (ic == null) return;

                      float dx = endX - startX;
                      float dy = endY - startY;

                      if (currentMode == MODE_EMOJI) {
                          float tabH = rowH * 0.68f;
                          float bottomTop = h - rowH;
                          float gridH = bottomTop - tabH;

                          if (isEmojiScrolling) return;

                          if (startY >= tabH && startY < bottomTop && Math.abs(dx) > dp(55) && Math.abs(dx) > Math.abs(dy) * 1.5f) {
                              if (dx < 0 && emojiCat < 9) {
                                  switchEmojiCategory(emojiCat + 1);
                              } else if (dx > 0 && emojiCat > 0) {
                                  switchEmojiCategory(emojiCat - 1);
                              }
                              return;
                          }

                          if (startY < tabH) {
                              int cat = (int) (startX / (w / 10f));
                              if (cat >= 0 && cat < 10) {
                                  switchEmojiCategory(cat);
                              }
                              return;
                          }

                          if (startY >= tabH && startY < bottomTop) {
                              if (emojiCat == 9) {
                                  float topControlsH = gridH * 0.30f;
                                  if (startY < tabH + topControlsH) {
                                      int btn = (int) (startX / (w / 5f));
                                      if (btn >= 0 && btn < 4) {
                                          applySize(btn);
                                      } else if (btn == 4) {
                                          useShiftKeyMode = !useShiftKeyMode;
                                          isShifted = false;
                                          prefs.edit().putBoolean("use_shift_key", useShiftKeyMode).apply();
                                      }
                                      return;
                                  }
                                  float colorAreaTop = tabH + topControlsH;
                                  float colorAreaH = gridH - topControlsH;
                                  int c = (int) (startX / (w / 4f));
                                  int r = (int) ((startY - colorAreaTop) / (colorAreaH / 2f));
                                  int chosenTheme = r * 4 + c;
                                  if (chosenTheme >= 0 && chosenTheme < 8) {
                                      applyTheme(chosenTheme);
                                  }
                                  return;
                              }

                              int cols = 8;
                              int visibleRows = showNumberRow ? 4 : 3;
                              float cellW = (w - dp(8)) / cols;
                              float cellH = gridH / visibleRows;
                              int c = (int) (startX / cellW);
                              int r = (int) ((startY - tabH + emojiScrollY) / cellH);
                              if (c >= 0 && c < cols && r >= 0) {
                                  int idx = r * cols + c;
                                  List<String> list = emojiLists[emojiCat];
                                  if (idx >= 0 && idx < list.size()) {
                                      String chosen = list.get(idx);
                                      ic.commitText(chosen, 1);
                                      recordRecentEmoji(chosen);
                                  }
                              }
                              return;
                          }

                          handleBottomBar(ic, startX, dy, w, rowH, wasHoldingBksp);
                          return;
                      }

                      if (Math.abs(dx) > dp(65) && Math.abs(dx) > Math.abs(dy) * 1.5f) {
                          if (dx < 0) {
                              deleteOneChar(ic);
                          } else {
                              if (currentMode == MODE_SYM) {
                                  triggerModeTransition(previousLangMode, -1f);
                              } else {
                                  previousLangMode = currentMode;
                                  triggerModeTransition(MODE_SYM, 1f);
                              }
                          }
                          return;
                      }

                      if (downRow == totalRows - 1) {
                          handleBottomBar(ic, startX, dy, w, rowH, wasHoldingBksp);
                          return;
                      }

                      boolean swipeDown = dy > rowH * 0.35f && Math.abs(dy) > Math.abs(dx);
                      String text = getKeyChar(downRow, downCol, swipeDown);
                      if (!text.isEmpty()) {
                          ic.commitText(text, 1);
                          if (isShifted && !swipeDown) {
                              isShifted = false;
                          }
                      }
                  }

                  private void handleBottomBar(InputConnection ic, float x, float dy, int w, float rowH, boolean wasHoldingBksp) {
                      float unit = w / 10f;
                      if (x < unit * 1.15f) {
                          if (dy < -rowH * 0.36f) {
                              applyTheme((themeIndex + 1) % THEMES.length);
                              return;
                          }
                          if (currentMode == MODE_EMOJI) {
                              triggerModeTransition(previousLangMode, -1f);
                          } else if (useShiftKeyMode) {
                              isShifted = !isShifted;
                              invalidate();
                          } else {
                              previousLangMode = (currentMode == MODE_SYM) ? MODE_KH : currentMode;
                              emojiScrollY = 0f;
                              triggerModeTransition(MODE_EMOJI, 1f);
                          }
                      } else if (x < unit * 2.3f) {
                          if (useShiftKeyMode && currentMode != MODE_EMOJI) {
                              previousLangMode = (currentMode == MODE_SYM) ? MODE_KH : currentMode;
                              emojiScrollY = 0f;
                              triggerModeTransition(MODE_EMOJI, 1f);
                          } else {
                              int nextLang = (currentMode == MODE_EN) ? MODE_KH : MODE_EN;
                              previousLangMode = nextLang;
                              isShifted = false;
                              triggerModeTransition(nextLang, nextLang == MODE_EN ? 1f : -1f);
                          }
                      } else if (x < unit * 7.4f) {
                          if (dy < -rowH * 0.36f) {
                              float midSpace = unit * 2.3f + (unit * 5.1f) / 2f;
                              if (useShiftKeyMode && Math.abs(x - midSpace) < unit * 1.2f) {
                                  int nextLang = (currentMode == MODE_EN) ? MODE_KH : MODE_EN;
                                  previousLangMode = nextLang;
                                  isShifted = false;
                                  triggerModeTransition(nextLang, 1f);
                              } else {
                                  ic.commitText(x < midSpace ? "?" : "\u17D4", 1);
                              }
                          } else {
                              ic.commitText(" ", 1);
                          }
                      } else if (x < unit * 8.7f) {
                          if (wasHoldingBksp) {
                              deleteOneChar(ic);
                          }
                      } else {
                          sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER);
                      }
                  }

                  private void deleteOneChar(InputConnection ic) {
                      CharSequence selected = ic.getSelectedText(0);
                      if (selected != null && selected.length() > 0) {
                          ic.commitText("", 1);
                      } else {
                          sendDownUpKeyEvents(KeyEvent.KEYCODE_DEL);
                      }
                  }
              }
          }
          EOF

      - name: Compile and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)

          "$BUILD_TOOLS/aapt2" compile --dir res -o res.zip
          "$BUILD_TOOLS/aapt2" link -o unaligned.apk -I "$PLATFORM/android.jar" --manifest AndroidManifest.xml --java gen res.zip

          javac -encoding UTF-8 -source 8 -target 8 -cp "$PLATFORM/android.jar" -d obj src/com/khmer/keyboard/*.java gen/com/khmer/keyboard/R.java
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --output . obj/com/khmer/keyboard/*.class

          zip -uj unaligned.apk classes.dex
          "$BUILD_TOOLS/zipalign" -p -f 4 unaligned.apk aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out KhmerEnglishEmojiKeyboard.apk aligned.apk

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Khmer-English-Emoji-Keyboard-APK
          path: KhmerEnglishEmojiKeyboard.apk
