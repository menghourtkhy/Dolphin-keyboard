name: Build Khmer English Emoji 8-Color Keyboard APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Android Keyboard Project
        run: |
          mkdir -p src/com/khmer/keyboard res/xml res/values gen obj

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.khmer.keyboard"
              android:versionCode="7"
              android:versionName="7.0">
              <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="33" />
              <application
                  android:label="Khmer NiDA Keyboard"
                  android:icon="@android:drawable/ic_dialog_dialer">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="Khmer NiDA Keyboard">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".KhmerIME"
                      android:label="Khmer NiDA Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android">
              <subtype
                  android:label="Khmer NiDA / English"
                  android:imeSubtypeLocale="km_KH"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          cat << 'EOF' > src/com/khmer/keyboard/MainActivity.java
          package com.khmer.keyboard;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String[] THEME_NAMES = {
                  "White (ស)", "Dark Mode (ងងឹត)", "Red (ក្រហម)", "Blue (ខៀវ)",
                  "Gold (មាស)", "Cherry (ឆឺរី)", "Orange (ទឹកក្រូច)", "Green (បៃតង)"
              };
              private static final String[] THEME_PREVIEW_COLORS = {
                  "#FFFFFF", "#1E293B", "#B91C1C", "#1D4ED8",
                  "#D97706", "#BE185D", "#EA580C", "#15803D"
              };
              private static final String[] SIZE_NAMES = {
                  "តូច (Small)", "មធ្យម (Normal)", "ធំ (Large)", "ធំខ្លាំង (XL)"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  SharedPreferences prefs = getSharedPreferences("khmer_emoji_prefs", Context.MODE_PRIVATE);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.parseColor("#F5F7FA"));

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 48, 40, 48);

                  TextView title = new TextView(this);
                  title.setText("ក្តារចុចខ្មែរ NiDA (Unicode Standard)");
                  title.setTextSize(20);
                  title.setTextColor(Color.parseColor("#1E293B"));
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, 18, 0, 8);

                  Button btnEnable = new Button(this);
                  btnEnable.setText("1. Enable Keyboard in Settings (បើកក្តារចុច)");
                  btnEnable.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)));
                  layout.addView(btnEnable, lp);

                  Button btnSelect = new Button(this);
                  btnSelect.setText("2. Select Khmer NiDA Keyboard (ជ្រើសរើសក្តារចុច)");
                  btnSelect.setOnClickListener(v -> {
                      InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                      if (imm != null) imm.showInputMethodPicker();
                  });
                  layout.addView(btnSelect, lp);

                  TextView styleLabel = new TextView(this);
                  styleLabel.setText("3. របៀបប្រើ NiDA (Keyboard UX Mode):");
                  styleLabel.setTextSize(15);
                  styleLabel.setTextColor(Color.parseColor("#334155"));
                  layout.addView(styleLabel, lp);

                  GridLayout modeGrid = new GridLayout(this);
                  modeGrid.setColumnCount(2);
                  String[] modes = {"Gesture (អូសចុះក្រោម)", "Classic NiDA (ប៊ូតុង ⇧ Shift)"};
                  for (int m = 0; m < 2; m++) {
                      final boolean useShift = (m == 1);
                      final String mName = modes[m];
                      Button mBtn = new Button(this);
                      mBtn.setText(mName);
                      mBtn.setBackgroundColor(Color.parseColor("#DBEAFE"));
                      mBtn.setTextColor(Color.parseColor("#1E3A8A"));
                      GridLayout.LayoutParams mlp = new GridLayout.LayoutParams();
                      mlp.width = 0;
                      mlp.height = GridLayout.LayoutParams.WRAP_CONTENT;
                      mlp.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                      mlp.setMargins(6, 6, 6, 6);
                      mBtn.setOnClickListener(v -> {
                          prefs.edit().putBoolean("use_shift_key", useShift).apply();
                          Toast.makeText(this, "Mode: " + mName, Toast.LENGTH_SHORT).show();
                      });
                      modeGrid.addView(mBtn, mlp);
                  }
                  layout.addView(modeGrid, lp);

                  TextView sizeLabel = new TextView(this);
                  sizeLabel.setText("4. ទំហំក្តារចុច (Keyboard Size):");
                  sizeLabel.setTextSize(15);
                  sizeLabel.setTextColor(Color.parseColor("#334155"));
                  layout.addView(sizeLabel, lp);

                  GridLayout sizeGrid = new GridLayout(this);
                  sizeGrid.setColumnCount(2);
                  for (int i = 0; i < SIZE_NAMES.length; i++) {
                      final int sIdx = i;
                      Button sBtn = new Button(this);
                      sBtn.setText(SIZE_NAMES[i]);
                      sBtn.setBackgroundColor(Color.parseColor("#E2E8F0"));
                      sBtn.setTextColor(Color.parseColor("#0F172A"));
                      GridLayout.LayoutParams slp = new GridLayout.LayoutParams();
                      slp.width = 0;
                      slp.height = GridLayout.LayoutParams.WRAP_CONTENT;
                      slp.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                      slp.setMargins(6, 6, 6, 6);
                      sBtn.setOnClickListener(v -> {
                          prefs.edit().putInt("size_index", sIdx).apply();
                          Toast.makeText(this, "Size: " + SIZE_NAMES[sIdx], Toast.LENGTH_SHORT).show();
                      });
                      sizeGrid.addView(sBtn, slp);
                  }
                  layout.addView(sizeGrid, lp);

                  TextView colorLabel = new TextView(this);
                  colorLabel.setText("5. ពណ៌ក្តារចុច (Choose Color Theme):");
                  colorLabel.setTextSize(15);
                  colorLabel.setTextColor(Color.parseColor("#334155"));
                  layout.addView(colorLabel, lp);

                  GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(2);
                  for (int i = 0; i < THEME_NAMES.length; i++) {
                      final int index = i;
                      Button cBtn = new Button(this);
                      cBtn.setText(THEME_NAMES[i]);
                      cBtn.setBackgroundColor(Color.parseColor(THEME_PREVIEW_COLORS[i]));
                      cBtn.setTextColor(i == 0 ? Color.parseColor("#111827") : Color.WHITE);
                      GridLayout.LayoutParams glp = new GridLayout.LayoutParams();
                      glp.width = 0;
                      glp.height = GridLayout.LayoutParams.WRAP_CONTENT;
                      glp.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                      glp.setMargins(6, 6, 6, 6);
                      cBtn.setOnClickListener(v -> {
                          prefs.edit().putInt("theme_index", index).apply();
                          Toast.makeText(this, "Selected: " + THEME_NAMES[index], Toast.LENGTH_SHORT).show();
                      });
                      grid.addView(cBtn, glp);
                  }
                  layout.addView(grid, lp);

                  EditText testBox = new EditText(this);
                  testBox.setHint("សាកល្បងលេខ និងសញ្ញាពិសេសខ្មែរ (១២៣៤៥៦៧៨៩០ ៗ ៏ ៛ ៍ ័ ៎ ៌ ៑)...");
                  testBox.setMinLines(3);
                  testBox.setGravity(Gravity.TOP | Gravity.START);
                  layout.addView(testBox, lp);

                  scroll.addView(layout);
                  setContentView(scroll);
              }
          }
          EOF

          cat << 'EOF' > src/com/khmer/keyboard/KhmerIME.java
          package com.khmer.keyboard;

          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.inputmethodservice.InputMethodService;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.HapticFeedbackConstants;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.VelocityTracker;
          import android.view.View;
          import android.view.animation.DecelerateInterpolator;
          import android.view.inputmethod.InputConnection;
          import android.widget.OverScroller;
          import java.util.ArrayList;
          import java.util.List;

          public class KhmerIME extends InputMethodService {
              private GestureKeyboardView kbView;

              @Override
              public View onCreateInputView() {
                  kbView = new GestureKeyboardView(this);
                  return kbView;
              }

              @Override
              public void onWindowShown() {
                  super.onWindowShown();
                  if (kbView != null) {
                      kbView.reloadSettingsFromPrefs();
                  }
              }

              private class GestureKeyboardView extends View {
                  private static final int MODE_KH = 0;
                  private static final int MODE_EN = 1;
                  private static final int MODE_SYM = 2;
                  private static final int MODE_EMOJI = 3;

                  private int currentMode = MODE_KH;
                  private int previousLangMode = MODE_KH;
                  private boolean showNumberRow = false;
                  private boolean useShiftKeyMode = false;
                  private boolean isShifted = false;

                  private int emojiCat = 1;
                  private float animTabPos = 1f;
                  private float emojiScrollY = 0f;
                  private float maxEmojiScrollY = 0f;
                  private boolean isEmojiScrolling = false;
                  private final OverScroller emojiScroller;
                  private VelocityTracker velocityTracker;

                  private float modeTransitionProgress = 1f;
                  private float modeSlideDirection = 1f;
                  private float popupScaleProgress = 0f;
                  private float swipeMorphProgress = 0f;
                  private int lastReleasedRow = -1, lastReleasedCol = -1;
                  private float keyReleaseFade = 0f;

                  private ValueAnimator modeAnimator;
                  private ValueAnimator tabAnimator;
                  private ValueAnimator popupAnimator;
                  private ValueAnimator releaseFadeAnimator;
                  private final DecelerateInterpolator smoothInterp = new DecelerateInterpolator(1.6f);

                  private int themeIndex = 0;
                  private int sizeIndex = 1;
                  private final float[] SIZE_SCALES = {0.88f, 1.00f, 1.12f, 1.24f};
                  private final String[] SIZE_LABELS = {"S (តូច)", "M (មធ្យម)", "L (ធំ)", "XL (ធំខ្លាំង)"};

                  private final String[][] THEMES = {
                      {"White (ស)", "#CBD5E1", "#FFFFFF", "#D1D5DB", "#AEB6C2", "#E2E8F0", "#111827", "#64748B", "#1A73E8"},
                      {"Dark Mode (ងងឹត)", "#0F172A", "#1E293B", "#334155", "#0F172A", "#334155", "#F8FAFC", "#94A3B8", "#3B82F6"},
                      {"Red (ក្រហម)", "#7F1D1D", "#B91C1C", "#991B1B", "#7F1D1D", "#DC2626", "#FFFFFF", "#FECACA", "#EF4444"},
                      {"Blue (ខៀវ)", "#1E3A8A", "#1D4ED8", "#1E40AF", "#1E3A8A", "#3B82F6", "#FFFFFF", "#BFDBFE", "#0284C7"},
                      {"Gold (មាស)", "#78350F", "#D97706", "#B45309", "#78350F", "#F59E0B", "#FFFFFF", "#FEF08A", "#CA8A04"},
                      {"Cherry (ឆឺរី)", "#831843", "#BE185D", "#9D174D", "#831843", "#EC4899", "#FFFFFF", "#FBCFE8", "#E11D48"},
                      {"Orange (ទឹកក្រូច)", "#7C2D12", "#EA580C", "#C2410C", "#7C2D12", "#F97316", "#FFFFFF", "#FED7AA", "#D97706"},
                      {"Green (បៃតង)", "#14532D", "#15803D", "#166534", "#14532D", "#22C55E", "#FFFFFF", "#BBF7D0", "#059669"}
                  };

                  private float startX, startY, curX, curY, lastY;
                  private boolean isTouching = false;
                  private boolean twoFingerGesture = false;
                  private float twoFingerStartY = 0;
                  private int downRow = -1, downCol = -1;
                  private boolean isHoldingBackspace = false;

                  private final Handler handler = new Handler(Looper.getMainLooper());
                  private final Runnable backspaceRepeater = new Runnable() {
                      @Override
                      public void run() {
                          if (isHoldingBackspace) {
                              InputConnection ic = getCurrentInputConnection();
                              if (ic != null) {
                                  deleteOneChar(ic);
                                  performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP);
                              }
                              handler.postDelayed(this, 65);
                          }
                      }
                  };

                  private final Paint bgPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint keyPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint spKeyPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint borderPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint topTextPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint botTextPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint popupPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint popupTextPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint accentPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path popupPath = new Path();

                  @SuppressWarnings("unchecked")
                  private final List<String>[] emojiLists = new ArrayList[9];
                  private final String[] CAT_ICONS = {"🕒", "😀", "👋", "🐻", "🍔", "🚗", "⚽", "💡", "🇰🇭", "🎨"};
                  private final SharedPreferences prefs;

                  // Main Khmer NiDA Rows (Official Unicode codepoints)
                  private final String[][][] KH_ROWS = {
                      {{"ឆ","ឈ"},{"ឹ","ឺ"},{"េ","ែ"},{"រ","ឬ"},{"ត","ទ"},{"យ","ួ"},{"ុ","ូ"},{"ិ","ី"},{"ោ","ៅ"},{"ផ","ភ"}},
                      {{"ា","ាំ"},{"ស","ៃ"},{"ដ","ឌ"},{"ថ","ធ"},{"ង","អ"},{"ហ","ះ"},{"្","ញ"},{"ក","គ"},{"ល","ឡ"},{"់","៉"}},
                      {{"ឋ","ឍ"},{"ខ","ឃ"},{"ច","ជ"},{"វ","េះ"},{"ប","ព"},{"ន","ណ"},{"ម","ំ"},{"៊","ុះ"},{"ៀ","ឿ"},{"ើ","ោះ"}}
                  };

                  // Official Khmer Unicode Digits (U+17E0..U+17E9) & Special Signs:
                  // ១/! | ២/ៗ (U+17D7) | ៣/៏ (U+17CF) | ៤/៛ (U+17DB) | ៥/% | ៦/៍ (U+17CD) | ៧/័ (U+17D0) | ៨/៎ (U+17CE) | ៩/៌ (U+17CC) | ០/៑ (U+17D1 Viriam)
                  private final String[][] KH_NUMS = {
                      {"\u17E1", "!"},
                      {"\u17E2", "\u17D7"},
                      {"\u17E3", "\u17CF"},
                      {"\u17E4", "\u17DB"},
                      {"\u17E5", "%"},
                      {"\u17E6", "\u17CD"},
                      {"\u17E7", "\u17D0"},
                      {"\u17E8", "\u17CE"},
                      {"\u17E9", "\u17CC"},
                      {"\u17E0", "\u17D1"}
                  };

                  // Complete Khmer Symbols, Independent Vowels & Classical Signs (U+17A5..U+17DC)
                  private final String[][][] SYM_ROWS = {
                      {
                          {"!", "1"},
                          {"\u17D7", "2"},
                          {"\u17CF", "3"},
                          {"\u17DB", "4"},
                          {"%", "5"},
                          {"\u17CD", "6"},
                          {"\u17D0", "7"},
                          {"\u17CE", "8"},
                          {"\u17CC", "9"},
                          {"\u17D1", "0"}
                      },
                      {
                          {"\u17D9", "\u17E1"}, // ៙ (Phnaek Muan) / ១
                          {"\u17DA", "\u17E2"}, // ៚ (Koomuut) / ២
                          {"\u17A5", "\u17E3"}, // ឥ / ៣
                          {"\u17AB", "\u17E4"}, // ឫ / ៤
                          {"\u17AD", "\u17E5"}, // ឮ / ៥
                          {"\u17AF", "\u17E6"}, // ឯ / ៦
                          {"\u17A7", "\u17E7"}, // ឧ / ៧
                          {"\u17B1", "\u17E8"}, // ឱ / ៨
                          {"\u17AA", "\u17E9"}, // ឪ / ៩
                          {"\u17B2", "\u17E0"}  // ឲ / ០
                      },
                      {
                          {"\u00AB", "\u00BB"}, // « / » (Khmer Quotes)
                          {",", "$"},
                          {"[", "+"},
                          {"]", "-"},
                          {"(", "\u17AC"},      // ( / ឬ
                          {")", "\u17AE"},      // ) / ឮ
                          {"\u17B3", "\u17DC"}, // ឳ / ៜ (Avakrahasannya)
                          {"\"", "'"},
                          {":", "\u17D6"},      // : / ៖ (Camnuc Pii Kuuh)
                          {"\u17D5", "\u17D8"}  // ៕ (Bariyoosan) / ៘ (Beyyal)
                      }
                  };

                  private final String[][][] EN_ROWS = {
                      {{"q","Q"},{"w","W"},{"e","E"},{"r","R"},{"t","T"},{"y","Y"},{"u","U"},{"i","I"},{"o","O"},{"p","P"}},
                      {{"a","A"},{"s","S"},{"d","D"},{"f","F"},{"g","G"},{"h","H"},{"j","J"},{"k","K"},{"l","L"},{"'","\""}},
                      {{"z","Z"},{"x","X"},{"c","C"},{"v","V"},{"b","B"},{"n","N"},{"m","M"},{",",";"},{".",":"},{"/","?"}}
                  };

                  private final String[][] EN_NUMS = {
                      {"1","!"},{"2","@"},{"3","#"},{"4","$"},{"5","%"},{"6","^"},{"7","&"},{"8","*"},{"9","("},{"0",")"}
                  };

                  public GestureKeyboardView(Context context) {
                      super(context);
                      emojiScroller = new OverScroller(context);
                      prefs = context.getSharedPreferences("khmer_emoji_prefs", Context.MODE_PRIVATE);
                      showNumberRow = prefs.getBoolean("show_num_row", false);
                      useShiftKeyMode = prefs.getBoolean("use_shift_key", false);

                      borderPaint.setStyle(Paint.Style.STROKE);
                      borderPaint.setStrokeWidth(1.5f);
                      topTextPaint.setTextAlign(Paint.Align.CENTER);
                      botTextPaint.setTextAlign(Paint.Align.CENTER);
                      popupTextPaint.setColor(Color.WHITE);
                      popupTextPaint.setTextAlign(Paint.Align.CENTER);

                      reloadSettingsFromPrefs();
                      initAllEmojis();
                  }

                  private void triggerModeTransition(int newMode, float direction) {
                      if (currentMode == newMode) return;
                      currentMode = newMode;
                      modeSlideDirection = direction;
                      if (modeAnimator != null) modeAnimator.cancel();
                      modeAnimator = ValueAnimator.ofFloat(0f, 1f);
                      modeAnimator.setDuration(190);
                      modeAnimator.setInterpolator(smoothInterp);
                      modeAnimator.addUpdateListener(anim -> {
                          modeTransitionProgress = (float) anim.getAnimatedValue();
                          invalidate();
                      });
                      modeAnimator.start();
                  }

                  private void switchEmojiCategory(int newCat) {
                      if (newCat < 0 || newCat > 9 || newCat == emojiCat) return;
                      float startTab = animTabPos;
                      emojiCat = newCat;
                      emojiScroller.forceFinished(true);
                      emojiScrollY = 0f;
                      if (tabAnimator != null) tabAnimator.cancel();
                      tabAnimator = ValueAnimator.ofFloat(startTab, (float) newCat);
                      tabAnimator.setDuration(210);
                      tabAnimator.setInterpolator(smoothInterp);
                      tabAnimator.addUpdateListener(anim -> {
                          animTabPos = (float) anim.getAnimatedValue();
                          invalidate();
                      });
                      tabAnimator.start();
                  }

                  private void triggerPopupAppear() {
                      if (popupAnimator != null) popupAnimator.cancel();
                      popupAnimator = ValueAnimator.ofFloat(0.6f, 1f);
                      popupAnimator.setDuration(110);
                      popupAnimator.setInterpolator(smoothInterp);
                      popupAnimator.addUpdateListener(anim -> {
                          popupScaleProgress = (float) anim.getAnimatedValue();
                          invalidate();
                      });
                      popupAnimator.start();
                  }

                  private void triggerKeyReleaseFade(int row, int col) {
                      lastReleasedRow = row;
                      lastReleasedCol = col;
                      if (releaseFadeAnimator != null) releaseFadeAnimator.cancel();
                      releaseFadeAnimator = ValueAnimator.ofFloat(1f, 0f);
                      releaseFadeAnimator.setDuration(150);
                      releaseFadeAnimator.setInterpolator(smoothInterp);
                      releaseFadeAnimator.addUpdateListener(anim -> {
                          keyReleaseFade = (float) anim.getAnimatedValue();
                          invalidate();
                      });
                      releaseFadeAnimator.start();
                  }

                  @Override
                  public void computeScroll() {
                      if (emojiScroller.computeScrollOffset()) {
                          emojiScrollY = emojiScroller.getCurrY();
                          if (emojiScrollY < 0f) emojiScrollY = 0f;
                          if (emojiScrollY > maxEmojiScrollY) emojiScrollY = maxEmojiScrollY;
                          postInvalidateOnAnimation();
                      }
                  }

                  public void reloadSettingsFromPrefs() {
                      themeIndex = prefs.getInt("theme_index", 0);
                      if (themeIndex < 0 || themeIndex >= THEMES.length) themeIndex = 0;
                      sizeIndex = prefs.getInt("size_index", 1);
                      if (sizeIndex < 0 || sizeIndex >= SIZE_SCALES.length) sizeIndex = 1;
                      useShiftKeyMode = prefs.getBoolean("use_shift_key", false);
                      applyTheme(themeIndex);
                      requestLayout();
                  }

                  private void applySize(int idx) {
                      sizeIndex = idx;
                      prefs.edit().putInt("size_index", sizeIndex).apply();
                      requestLayout();
                      invalidate();
                  }

                  private void applyTheme(int idx) {
                      themeIndex = idx;
                      prefs.edit().putInt("theme_index", themeIndex).apply();
                      String[] t = THEMES[themeIndex];
                      bgPaint.setColor(Color.parseColor(t[1]));
                      keyPaint.setColor(Color.parseColor(t[2]));
                      spKeyPaint.setColor(Color.parseColor(t[4]));
                      borderPaint.setColor(Color.parseColor(t[5]));
                      topTextPaint.setColor(Color.parseColor(t[6]));
                      botTextPaint.setColor(Color.parseColor(t[7]));
                      accentPaint.setColor(Color.parseColor(t[8]));
                      invalidate();
                  }

                  private void addRange(List<String> list, int start, int end) {
                      for (int cp = start; cp <= end; cp++) {
                          if (!Character.isDefined(cp)) continue;
                          String s = new String(Character.toChars(cp));
                          if (topTextPaint.hasGlyph(s) && !list.contains(s)) {
                              list.add(s);
                          }
                      }
                  }

